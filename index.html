<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База активистов Горного</title>
<meta name="description" content="База активистов Горного: портфолио активистов, участие в мероприятиях, отзывы ГО, организаторов, капитанов и кураторов. Вход для активистов и организаторов.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%23b9791a'/%3E%3Cpath d='M17 6 27 12v10l-10 6-10-6V12z' fill='none' stroke='%231b1303' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: narrow working column under a sticky bar; sign-in card when logged out; search list -> person card (contacts left, work + comments right) */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#141d2b; --muted:#5a6578; --line:#d9dfe8;
  --accent:#b9791a; --accent-ink:#7a4d08; --accent-soft:#f6ead5;
  --ok:#2c7a51; --ok-soft:#e1f1e8; --wait:#2f5f9e; --wait-soft:#e2ebf7; --bad:#b23a2e; --bad-soft:#f7e3e0;
  --shadow:0 1px 2px rgba(20,29,43,.06),0 4px 16px rgba(20,29,43,.05);
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e141d; --surface:#161e2b; --ink:#e6ebf2; --muted:#97a2b4; --line:#273244;
    --accent:#e2a640; --accent-ink:#f0c47a; --accent-soft:#3a2d16;
    --ok:#5cc28d; --ok-soft:#173226; --wait:#7fa9e6; --wait-soft:#1a2a42; --bad:#ec7f72; --bad-soft:#3b1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2}
h2{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--font-display);font-weight:600;font-size:15px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--muted)}
nav a:hover{color:var(--ink);background:var(--bg)}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.me{display:flex;align-items:center;gap:8px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}

main{max-width:1040px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
.lede{color:var(--muted);margin:6px 0 0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.auth{max-width:460px;width:100%;margin:4vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .intro{display:flex;flex-direction:column;gap:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;gap:4px}
.tabs button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 6px 4px 16px;box-shadow:var(--shadow);margin-top:16px}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox svg{flex:none;color:var(--muted)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;padding:12px 0;color:var(--ink);outline:none}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}

.results{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,220px) 110px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;transition:border-color .15s}
.row:hover{border-color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;font-weight:600;flex:none}
.avatar.lg{width:64px;height:64px;font-size:20px;border-radius:16px}
.avatar{overflow:hidden;position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.avatar.xl{width:112px;height:112px;font-size:32px;border-radius:24px}
.photo-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.photo-row .photo-actions{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.photo-row .form-actions{gap:6px}
.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.last{display:flex;flex-direction:column;min-width:0}
.pos{font-weight:600;font-size:13px}
.ev{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.row{grid-template-columns:44px minmax(0,1fr)}.last,.count{grid-column:2;text-align:left}}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}

.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:9px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1303}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent;padding:6px 8px}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.wide{width:100%}

.back{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;align-self:flex-start}
.back:hover{color:var(--ink)}
.person-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.person-head .grow{flex:1;min-width:200px}
.person-head h1{overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}

dl.contacts{margin:0;display:flex;flex-direction:column;gap:12px}
dl.contacts div{display:flex;flex-direction:column;gap:1px;min-width:0}
dl.contacts dt{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
dl.contacts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
dl.contacts dd a{color:var(--accent-ink);text-decoration:none}
dl.contacts dd a:hover{text-decoration:underline}
.copy{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:0 0 0 8px;cursor:pointer}
.copy:hover{color:var(--ink)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.date{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
td.act{width:1%;white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.kur{background:var(--wait-soft);color:var(--wait)}
.tag.kap{background:var(--ok-soft);color:var(--ok)}
.tag.oth{background:var(--bg);color:var(--muted)}

.comments{display:flex;flex-direction:column;gap:10px}
.comment{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.comment.kur{border-left-color:var(--wait)}
.comment.kap{border-left-color:var(--ok)}
.comment.oth{border-left-color:var(--line)}
.comment-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.comment-h .who{font-weight:700}
.comment-h .when{color:var(--muted)}
.comment-h .btn{margin-left:auto}
.comment p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:72px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.subform{border-top:1px solid var(--line);padding-top:14px}
.subform h3{font-size:13px;font-family:var(--font-body);font-weight:700;margin-bottom:2px}
.formerr{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.formerr:empty{display:none}

.status{display:flex;gap:14px;align-items:flex-start}
.status .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.status.ok .dot{background:var(--ok)} .status.wait .dot{background:var(--wait)} .status.bad .dot{background:var(--bad)} .status.acc .dot{background:var(--accent)}
.status h2{font-size:17px}
.status p{margin:4px 0 0;color:var(--muted);max-width:64ch}

.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.toast[hidden]{display:none}
.skeleton{height:68px;border-radius:12px;background:linear-gradient(90deg,var(--surface),var(--bg),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
select.access{width:auto;padding:6px 8px;font-size:14px}
code{background:var(--bg);padding:1px 6px;border-radius:5px;font-size:13px}

/* v2: участие, функции, отзывы */
.entries{display:flex;flex-direction:column;gap:12px}
.entry{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.entry-h{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.entry-h .ev-name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.entry-h .when{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.entry-h .acts{margin-left:auto;display:flex;gap:2px}
.tag.team-org{background:var(--accent-soft);color:var(--accent-ink)}
.tag.team-media{background:var(--wait-soft);color:var(--wait)}
.tag.team-vol{background:var(--ok-soft);color:var(--ok)}
.tag.pos{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.fchip b{color:var(--accent-ink);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.reviews{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.reviews{grid-template-columns:minmax(0,1fr)}}
.rv{border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0;border-left:3px solid var(--line)}
.rv.self{border-left-color:var(--wait)}
.rv.go{border-left-color:var(--accent)}
.rv-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rv-by{font-size:12px;color:var(--muted)}
.rv p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.rv .none{color:var(--muted);font-size:14px}
.rv .btn{align-self:flex-start;padding:4px 10px;font-size:13px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{position:relative;display:inline-flex;flex-direction:row;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.check span{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);transition:background .12s,border-color .12s}
.check:hover span{border-color:var(--muted)}
.check input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters select{width:auto;max-width:100%;padding:7px 10px;font-size:14px}
.mini-fn{font-size:12px;color:var(--accent-ink);margin-top:2px;overflow-wrap:anywhere}
.dialog.wide{max-width:680px}
.tag.team-part{background:var(--line);color:var(--ink)}
.did{display:flex;flex-direction:column;gap:4px}
.did p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.did .none{color:var(--muted);font-size:14px}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.link .grow{flex:1;min-width:200px}
.link .t{font-weight:700;color:var(--accent-ink);text-decoration:none;overflow-wrap:anywhere;font-size:16px}
.link a.t:hover{text-decoration:underline}
.link .u{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.link p{margin:4px 0 0;font-size:14px}
.link .acts{display:flex;gap:2px}
.intro-card{background:var(--wait-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.skills{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#search" aria-label="На главную">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M17 6 27 12v10l-10 6-10-6V12z" fill="none" stroke="#1b1303" stroke-width="2" stroke-linejoin="round"/><path d="M17 6v22M7 12l10 6 10-6" fill="none" stroke="#1b1303" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/></svg>
      <span><b>Актив Горного</b><small>база активистов</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </div>
</header>
<main id="view"><div class="skeleton"></div></main>

<datalist id="dl-events"></datalist>
<div id="overlay" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" id="dialog"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- справочники ---------- */
// Команды и их должности. Чтобы поменять список, исправьте строки в кавычках.
// Пустой список pos:[] значит, что в этой команде должность не указывается.
const TEAMS={
  "Организаторы":{cls:"team-org",  pos:["ГО","Организатор","Капитан команды","Куратор","Ведущий","Редактор","РПГ"]},
  "Медиа":       {cls:"team-media",pos:["Медиа-менеджер","Фотограф","Видеограф","Монтажёр","Дизайнер","Редактор","Рилсмейкер"]},
  "Волонтёры":   {cls:"team-vol",  pos:[]},
  "Участники":   {cls:"team-part", pos:[]}
};
const TEAM_KEYS=Object.keys(TEAMS);
// Старые названия должностей (из прошлых версий сайта) -> команда, чтобы старые записи не терялись в фильтрах
const LEGACY_POS={"Главный организатор":"Организаторы","Ответственный за площадку":"Организаторы","Ответственный за блок":"Организаторы","Техническая группа":"Организаторы",
  "Руководитель медиа":"Медиа","SMM":"Медиа","Копирайтер":"Медиа",
  "Волонтёр":"Волонтёры","Старший волонтёр":"Волонтёры","Хелпер":"Волонтёры","Аниматор":"Волонтёры","Регистрация":"Волонтёры"};
const POS2TEAM={...LEGACY_POS};TEAM_KEYS.forEach(k=>TEAMS[k].pos.forEach(p=>{if(!POS2TEAM[p])POS2TEAM[p]=k;}));
// Команда записи: указанная, а для старых записей — по должности
const teamOf=w=>(w&&(w.team||POS2TEAM[w.position]))||"";
// Семестр по дате: осенний — 1 сентября – 31 декабря, весенний — 1 января – 31 августа; год календарный
function semOf(d){const m=/^(\d{4})-(\d{2})/.exec(d||"");if(!m)return null;const y=+m[1],mo=+m[2];
  return {sem:mo>=9?"Осенний":"Весенний",year:y};}
const semShort=d=>{const s=semOf(d);return s?`${s.sem==="Осенний"?"осень":"весна"} ${s.year}`:"";};
const REVIEW_GO="Отзыв ГО / организатора / капитана / куратора";

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();

function initials(fio){const p=String(fio||"").trim().split(/\s+/);return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase();}
function fmtDate(d){if(!d)return"";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);if(!m)return esc(d);return `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}`;}
function fmtTs(ts){if(!ts)return"";const d=new Date(ts);if(isNaN(d))return"";return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
function tgHandle(v){v=String(v||"").trim();if(!v)return"";return v.replace(/^https?:\/\/(www\.)?(t\.me|telegram\.me)\//i,"").replace(/^@/,"").split(/[/?#\s]/)[0];}
function vkLink(v){v=String(v||"").trim();if(!v)return"";if(/^https?:\/\//i.test(v))return v;return "https://vk.com/"+v.replace(/^(www\.)?vk\.com\//i,"").replace(/^@/,"");}
function vkLabel(v){return String(v||"").trim().replace(/^https?:\/\/(www\.)?/i,"");}
// Ссылка для вкладки «Ссылки»: только http(s), без «javascript:» и прочего
function safeUrl(v){v=String(v||"").trim();if(!v)return"";if(!/^[a-z][a-z0-9+.-]*:/i.test(v))v="https://"+v;return /^https?:\/\//i.test(v)?v:"";}
function plural(n,a,b,c){const m10=n%10,m100=n%100;return n+" "+(m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c);}
let toastT;
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,bad?6500:2800);}
function errText(e){
  const m=String((e&&(e.message||e.error_description))||e||"");
  if(/row-level security|permission denied/i.test(m))return "Нет прав на это действие.";
  if(/Invalid login credentials/i.test(m))return "Неверная почта или пароль.";
  if(/Email not confirmed/i.test(m))return "Почта не подтверждена. Откройте письмо от Supabase и перейдите по ссылке.";
  if(/already registered|already been registered/i.test(m))return "Этот адрес уже зарегистрирован. Войдите во вкладке «Вход».";
  if(/Password should be at least/i.test(m))return "Пароль слишком короткий: нужно минимум 6 символов.";
  if(/rate limit|too many/i.test(m))return "Слишком много попыток. Подождите пару минут.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return "Нет связи с базой. Проверьте интернет и попробуйте снова.";
  if(/signups? not allowed/i.test(m))return "Регистрация на сайте выключена администратором.";
  if(/Bucket not found/i.test(m))return "Хранилище для фото не настроено. Администратору нужно ещё раз запустить supabase-setup.sql.";
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return "Фото слишком большое.";
  if(/mime type|invalid_mime_type/i.test(m))return "Этот формат не подходит. Выберите JPG, PNG или WebP.";
  if(/column .* does not exist|Could not find the .* (column|table)|relation .* does not exist|work_position_check|profiles_avatar_path/i.test(m))return "База не обновлена до новой версии. Администратору нужно ещё раз запустить supabase-setup.sql.";
  return m||"Что-то пошло не так. Попробуйте ещё раз.";
}

const PHOTO={};   // путь -> {url, exp}: временные ссылки на фото из закрытого хранилища
function avatarHTML(fio,path,cls){return `<div class="avatar${cls?" "+cls:""}" aria-hidden="true"${path?` data-photo="${esc(path)}"`:""}>${esc(initials(fio))}</div>`;}
async function hydratePhotos(){
  if(!S.sb)return;
  const els=[...document.querySelectorAll("[data-photo]")];if(!els.length)return;
  const now=Date.now(),need=[...new Set(els.map(e=>e.dataset.photo).filter(p=>!PHOTO[p]||PHOTO[p].exp<now))];
  if(need.length){
    try{const {data,error}=await S.sb.storage.from("avatars").createSignedUrls(need,3600);
      if(!error&&data)data.forEach(d=>{if(d&&d.signedUrl&&d.path)PHOTO[d.path]={url:d.signedUrl,exp:now+50*60*1000};});}catch(e){}
  }
  for(const e of els){
    const ph=PHOTO[e.dataset.photo];
    if(!ph||!e.isConnected||e.querySelector("img"))continue;
    const img=new Image();img.alt="";img.decoding="async";
    img.onload=()=>{if(e.isConnected&&!e.querySelector("img"))e.appendChild(img);};
    img.src=ph.url;
  }
}
// Обрезаем фото до квадрата по центру и уменьшаем до 512×512 JPEG, чтобы файл был лёгким
async function fileToSquareJpeg(file,size=512){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const side=Math.min(img.naturalWidth,img.naturalHeight);if(!side)throw new Error("empty");
    const out=Math.min(size,side),c=document.createElement("canvas");c.width=c.height=out;
    c.getContext("2d").drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,out,out);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.85));
  }finally{URL.revokeObjectURL(url);}
}
async function uploadAvatar(file){
  if(!file)return;
  if(file.size>20*1024*1024)return toast("Файл слишком большой: выберите фото до 20 МБ.",true);
  let blob;
  try{blob=await fileToSquareJpeg(file);}catch(e){return toast("Не удалось прочитать фото. Выберите файл JPG или PNG.",true);}
  const path=`${S.me.id}/avatar-${Date.now()}.jpg`;
  const up=await S.sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg",upsert:false});
  if(up.error)return toast(errText(up.error),true);
  const old=S.me.avatar;
  const {error}=await S.sb.from("profiles").update({avatar:path}).eq("id",S.me.id);
  if(error){await S.sb.storage.from("avatars").remove([path]);return toast(errText(error),true);}
  if(old)await S.sb.storage.from("avatars").remove([old]);
  await loadMe();S.listLoaded=false;toast("Фото обновлено");viewProfile();
}

function parseRoute(){const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(["profile","users","my","links"].includes(h))return{v:h};
  const m=/^a-([0-9a-f-]{36})$/i.exec(h);if(m)return{v:"a",id:m[1]};return{v:"search"};}

function route(){
  renderTop();
  if(!S.session){viewAuth();return;}
  if(!S.me){viewNoProfile();return;}
  const r=parseRoute();
  if(r.v==="profile"){viewProfile();return;}
  if(canBrowse()&&r.v==="links"){viewLinks();return;}
  if(isActivist()){
    if(r.v==="a"){viewActivist(r.id);return;}
    if(rawHash()==="search"){viewSearch();return;}
    viewMyCard();return;                       // по умолчанию активист попадает в свою карточку
  }
  if(!canView()){viewWaiting();return;}
  if(r.v==="users"&&isAdmin()){viewUsers();return;}
  if(r.v==="a"){viewActivist(r.id);return;}
  viewSearch();
}

// Должности для фильтра: справочник выбранной команды (или всех) + то, что реально есть в базе
function posGroups(){
  const keys=S.fTeam?[S.fTeam]:TEAM_KEYS.filter(k=>TEAMS[k].pos.length);
  const groups=keys.map(k=>[k,[...TEAMS[k].pos]]).filter(g=>g[1].length||S.fTeam);
  const known=new Set(groups.flatMap(g=>g[1])),extra=new Set();
  for(const w of S.work){
    const v=w.position;if(!v||known.has(v))continue;
    if(S.fTeam&&teamOf(w)!==S.fTeam)continue;
    const g=groups.find(x=>x[0]===teamOf(w));
    if(g){g[1].push(v);known.add(v);}else extra.add(v);
  }
  if(extra.size)groups.push(["Другие",[...extra].sort((a,b)=>a.localeCompare(b,"ru"))]);
  return groups.filter(g=>g[1].length);
}
function yearsInData(){return [...new Set(S.work.map(w=>semOf(w.date)).filter(Boolean).map(s=>s.year))].sort((a,b)=>b-a);}

      &&(!S.fSem||(s&&s.sem===S.fSem))&&(!S.fYear||(s&&String(s.year)===S.fYear));};
  const filtering=S.fTeam||S.fPos||S.fSem||S.fYear;
  if(filtering)list=list.filter(x=>x.ws.some(match));
  const hits=x=>filtering?x.ws.filter(match).length:0;
  list.sort((x,y)=>hits(y)-hits(x)||(norm(x.a.fio).startsWith(q0)?0:1)-(norm(y.a.fio).startsWith(q0)?0:1)||String(x.a.fio).localeCompare(String(y.a.fio),"ru"));
  $("#stats").textContent=`Найдено ${list.length} из ${plural(n,"активиста","активистов","активистов")}`;
  if(!n){res.innerHTML=`<div class="empty"><strong>База пока пустая</strong><span>${canEdit()?"Добавьте первого активиста кнопкой выше или пригласите активистов зарегистрироваться самим.":"Активистов добавляют редакторы."}</span></div>`;return;}
  if(!list.length){res.innerHTML=`<div class="empty"><strong>Никого не нашли</strong><span>Попробуйте убрать фильтры или ввести только фамилию.</span></div>`;return;}
  res.innerHTML=list.slice(0,300).map(({a,ws})=>{
    const pool=filtering?ws.filter(match):ws;
    const lw=pool.slice().sort((x,y)=>String(y.date||"").localeCompare(String(x.date||"")))[0],tg=tgHandle(a.tg);
    const sub=[a.grp,tg?"@"+tg:""].filter(Boolean).map(esc).join(" · ")||"&nbsp;";
    const head=lw?[lw.position,teamOf(lw)].filter(Boolean).map(esc).join(" · "):"";
    return `<a class="row" href="#a-${esc(a.id)}">
      ${avatarHTML(a.fio,a.avatar)}
      <div style="min-width:0"><div class="name">${esc(a.fio)}</div><div class="sub">${sub}</div></div>
      <div class="last">${lw?`<span class="pos">${head}</span><span class="ev">${esc(lw.event)}${lw.date?", "+fmtDate(lw.date):""}</span>`:`<span class="ev">Мероприятий пока нет</span>`}</div>
      <div class="count">${ws.length?plural(ws.length,"мероприятие","мероприятия","мероприятий"):""}</div></a>`;}).join("")
    +(list.length>300?`<p class="muted small">Показаны первые 300 из ${list.length}. Уточните запрос.</p>`:"");
  hydratePhotos();
}

  <section class="card" id="users-card"><div class="skeleton"></div></section>`;
  const {data,error}=await S.sb.from("profiles").select("*").order("created_at",{ascending:false});
  if(error){toast(errText(error),true);return;}
  const order={pending:0,activist:1,editor:1,admin:1,viewer:2,blocked:3};
  const list=(data||[]).sort((x,y)=>(order[x.access]??9)-(order[y.access]??9));
  const pend=list.filter(u=>u.access==="pending").length;
  $("#users-card").innerHTML=`<div class="card-h"><h2>Все пользователи</h2><span class="muted small">${pend?plural(pend,"заявка ждёт","заявки ждут","заявок ждут")+" подтверждения":"новых заявок нет"}</span></div>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>ФИО</th><th>Группа</th><th>Контакты</th><th>Доступ</th></tr></thead><tbody>
  ${list.map(u=>{const tg=tgHandle(u.tg);const self=u.id===S.me.id;
    return `<tr><td><b>${esc(u.fio||"Без имени")}</b><div class="sub">${esc(u.email)} · ${esc(fmtTs(u.created_at))}</div></td>
    <td class="small">${esc(u.direction)}</td>
    <td class="small">${esc(u.phone)}${tg?`<br><a href="https://t.me/${esc(tg)}" target="_blank" rel="noopener">@${esc(tg)}</a>`:""}</td>
    <td>${self?`<span class="chip acc">Это вы</span>`:`<select class="access" data-user="${esc(u.id)}" aria-label="Доступ для ${esc(u.fio)}">${Object.entries(ACCESS).map(([k,v])=>`<option value="${k}"${u.access===k?" selected":""}>${v[0]}</option>`).join("")}</select>`}</td></tr>`;}).join("")}
  </tbody></table></div>`:`<p class="muted">Пользователей пока нет.</p>`}`;
}
document.addEventListener("change",async e=>{
  const s=e.target.closest("select.access");if(!s)return;
  s.disabled=true;
  const {error}=await S.sb.rpc("set_access",{target:s.dataset.user,new_access:s.value});
  if(error){toast(errText(error),true);}else toast("Доступ изменён: "+ACCESS[s.value][0]+(s.value==="activist"?". Карточка привязана.":""));
  S.listLoaded=false;viewUsers();
});

/* ---------- dialogs ---------- */
function openDialog(html,wide){const d=$("#dialog");d.className="dialog"+(wide?" wide":"");d.innerHTML=html;$("#overlay").hidden=false;const f=$("#dialog input:not([type=checkbox]):not([type=radio]),#dialog textarea,#dialog button.primary");if(f)setTimeout(()=>f.focus(),0);}
function closeDialog(){$("#overlay").hidden=true;$("#dialog").innerHTML="";}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeDialog();});
let confirmResolve=null;
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden){if(confirmResolve){const r=confirmResolve;confirmResolve=null;r(false);}closeDialog();}});
function confirmBox(title,text,ok){return new Promise(res=>{confirmResolve=res;openDialog(`<h2 id="dlg-title">${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p><div class="form-actions"><button class="btn primary" type="button" data-act="confirm-yes">${esc(ok)}</button><button class="btn" type="button" data-act="confirm-no">Отмена</button></div>`);});}
function activistForm(a){
  a=a||{};
  openDialog(`<h2 id="dlg-title">${a.id?"Контакты и данные":"Новый активист"}</h2>
  <form data-form="activist" data-id="${esc(a.id||"")}"><div class="fields">
    <label class="full" for="f-fio">ФИО<input id="f-fio" name="fio" required maxlength="200" value="${esc(a.fio)}" placeholder="Иванова Мария Андреевна"></label>
    <label for="f-grp">Группа<input id="f-grp" name="grp" maxlength="50" value="${esc(a.grp)}" placeholder="ГГ-24-1"></label>
    <label for="f-phone">Телефон<input id="f-phone" name="phone" type="tel" maxlength="50" value="${esc(a.phone)}" placeholder="+7 900 000-00-00"></label>
    <label for="f-tg">Telegram<input id="f-tg" name="tg" maxlength="100" value="${esc(a.tg)}" placeholder="@nickname"></label>
    <label for="f-vk">ВКонтакте<input id="f-vk" name="vk" maxlength="200" value="${esc(a.vk)}" placeholder="vk.com/id123"></label>
    <label class="full" for="f-email">Почта<input id="f-email" name="email" type="email" maxlength="200" value="${esc(a.email)}" placeholder="name@mail.ru"></label>
    <label class="full" for="f-about">О себе / навыки<textarea id="f-about" name="about" maxlength="2000" placeholder="Умею вести мероприятия, есть фотоаппарат">${esc(a.about)}</textarea></label>
  </div>
  <p class="formerr" id="dlg-err"></p>
  <div class="form-actions"><button class="btn primary" type="submit">${a.id?"Сохранить":"Добавить в базу"}</button><button class="btn" type="button" data-act="close">Отмена</button></div></form>`);
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tab=e.target.closest("[data-tab]");if(tab){authTab=tab.dataset.tab;viewAuth();return;}
  const b=e.target.closest("[data-act],[data-copy]");if(!b)return;
  if(b.dataset.copy!==undefined){try{await navigator.clipboard.writeText(b.dataset.copy);toast("Скопировано");}catch(err){toast("Не удалось скопировать",true);}return;}
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="close")return closeDialog();
  if(act==="confirm-yes"||act==="confirm-no"){const r=confirmResolve;confirmResolve=null;closeDialog();if(r)r(act==="confirm-yes");return;}
  if(act==="logout"){await S.sb.auth.signOut();S.session=null;S.me=null;S.listLoaded=false;location.hash="";route();return;}
  if(act==="recheck"){b.disabled=true;await loadMe();route();if(!canView()&&!isActivist())toast("Доступ пока не выдан");return;}
  if(act==="reset-filters"){S.fTeam="";S.fPos="";S.fSem="";S.fYear="";S.query="";viewSearch();return;}
  if(act==="pick-photo"){const inp=$("#p-photo");if(inp)inp.click();return;}
  if(act==="del-photo"){
    if(!await confirmBox("Удалить фото?","Вместо фото снова будут инициалы.","Удалить"))return;
    const old=S.me.avatar;
    const {error}=await S.sb.from("profiles").update({avatar:""}).eq("id",S.me.id);
    if(error)return toast(errText(error),true);
    if(old)await S.sb.storage.from("avatars").remove([old]);
    await loadMe();S.listLoaded=false;toast("Фото удалено");viewProfile();return;
  }
  if(act==="new")return activistForm(null);
  if(act==="edit")return activistForm(S.current&&S.current.a);
  if(act==="add-work")return workForm(null);
  if(act==="edit-work")return workForm(S.current.work.find(x=>x.id===id));
  if(act==="review")return reviewForm(id,b.dataset.kind);
  if(act==="edit-link")return linkForm((S.links||[]).find(x=>x.id===id)||{});
  if(act==="link-up"){
    const L=S.links||[],i=L.findIndex(x=>x.id===id);if(i<1)return;
    const order=L.map(x=>x.id);[order[i-1],order[i]]=[order[i],order[i-1]];
    b.disabled=true;
    for(let k=0;k<order.length;k++){const {error}=await S.sb.from("links").update({sort:k}).eq("id",order[k]);if(error){toast(errText(error),true);break;}}
    viewLinks();return;
  }
  if(act==="del-link"){if(!await confirmBox("Удалить ссылку?","Ссылка исчезнет из вкладки «Ссылки».","Удалить"))return;
    const {error}=await S.sb.from("links").delete().eq("id",id);if(error)return toast(errText(error),true);toast("Ссылка удалена");viewLinks();return;}
  if(act==="del-activist"){
    const a=S.current&&S.current.a;if(!a)return;
    if(!await confirmBox("Удалить карточку?",`${a.fio}, всё участие, отзывы и комментарии будут удалены без возможности восстановления.`,"Удалить навсегда"))return;
    const {error}=await S.sb.from("activists").delete().eq("id",a.id);
    if(error)return toast(errText(error),true);
    toast("Карточка удалена");S.listLoaded=false;location.hash="search";return;
  }
  if(act==="del-work"){if(!await confirmBox("Удалить запись?","Запись об участии и отзывы к ней исчезнут из карточки.","Удалить"))return;
    const {error,count}=await S.sb.from("work").delete({count:"exact"}).eq("id",id);if(error)return toast(errText(error),true);
    if(count===0)return toast("Не удалось удалить: по записи уже есть отзыв.",true);
    toast("Запись удалена");refreshActivist();return;}
});

document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries());for(const k in fd)fd[k]=String(fd[k]).trim();
  const btn=f.querySelector("button[type=submit]");if(btn)btn.disabled=true;
  const setErr=(sel,msg)=>{const el=$(sel);if(el)el.textContent=msg;else toast(msg,true);};
  try{
    const kind=f.dataset.form;
    if(kind==="login"){
      const {error}=await S.sb.auth.signInWithPassword({email:fd.email,password:fd.password});
      if(error)return setErr("#auth-err",errText(error));
      const {data}=await S.sb.auth.getSession();S.session=data.session;await loadMe();location.hash=isActivist()?"my":"search";route();
    }
    else if(kind==="signup"){
      if(!fd.fio)return setErr("#auth-err","Укажите ФИО.");
      const {data,error}=await S.sb.auth.signUp({email:fd.email,password:fd.password,options:{data:{fio:fd.fio,phone:fd.phone,tg:fd.tg,direction:fd.direction}}});
      if(error)return setErr("#auth-err",errText(error));
      if(!data.session){authTab="login";viewAuth();toast("Проверьте почту: пришло письмо со ссылкой для подтверждения. Потом войдите.");return;}
      S.session=data.session;await loadMe();route();toast("Заявка отправлена");
    }
    else if(kind==="profile"){
      if(!fd.fio)return toast("Укажите ФИО",true);
      const {error}=await S.sb.from("profiles").update({fio:fd.fio,phone:fd.phone,tg:fd.tg,vk:fd.vk,direction:fd.direction}).eq("id",S.me.id);
      if(error)return toast(errText(error),true);
      await loadMe();toast("Профиль сохранён");route();
    }
    else if(kind==="activist"){
      if(!fd.fio)return setErr("#dlg-err","Укажите ФИО.");
      const row={fio:fd.fio,grp:fd.grp,phone:fd.phone,tg:fd.tg,vk:fd.vk,email:fd.email,about:fd.about,updated_at:new Date().toISOString()};
      const id=f.dataset.id;
      if(id){
        const {error}=await S.sb.from("activists").update(row).eq("id",id);
        if(error)return setErr("#dlg-err",errText(error));
        closeDialog();toast("Сохранено");refreshActivist();
      }else{
        const {data,error}=await S.sb.from("activists").insert(row).select("id").single();
        if(error)return setErr("#dlg-err",errText(error));
        closeDialog();toast("Активист добавлен");S.listLoaded=false;location.hash="a-"+data.id;
      }
    }
    else if(kind==="work"){
      const team=(f.querySelector('input[name="team"]:checked')||{}).value||"";
      if(!fd.event)return setErr("#dlg-err","Укажите мероприятие.");
      if(!team)return setErr("#dlg-err","Выберите команду.");
      const position=TEAMS[team].pos.length?currentPos():"";
      if(TEAMS[team].pos.length&&!position)return setErr("#dlg-err","Выберите должность.");
      const row={event:fd.event,date:fd.date||null,team,position,note:fd.note||""};
      const id=f.dataset.id;let error;
      if(id){
        const old=S.current.work.find(x=>x.id===id)||{};
        if((old.functions||[]).length)row.functions=[]; // старые галочки переносятся в текст «Что делал(а)»
        ({error}=await S.sb.from("work").update(row).eq("id",id));
      }else{
        if(fd.self_review)row.self_review=fd.self_review;
        if(fd.go_review)row.go_review=fd.go_review;
        ({error}=await S.sb.from("work").insert({...row,activist_id:S.current.a.id}));
      }
      if(error)return setErr("#dlg-err",errText(error));
      closeDialog();toast(id?"Сохранено":"Участие добавлено");refreshActivist();
    }
    else if(kind==="review"){
      const col=f.dataset.kind==="self"?"self_review":"go_review";
      const {error}=await S.sb.from("work").update({[col]:fd.text||""}).eq("id",f.dataset.id);
      if(error)return setErr("#dlg-err",errText(error));
      closeDialog();toast(fd.text?"Сохранено":"Удалено");refreshActivist();
    }
    else if(kind==="link"){
      const url=safeUrl(fd.url),errSel=f.dataset.id?"#dlg-err":"#link-err";
      if(!fd.title)return setErr(errSel,"Укажите название.");
      if(!url)return setErr(errSel,"Адрес должен начинаться с https:// или http://");
      const row={title:fd.title,url,description:fd.description||""};
      let error;
      if(f.dataset.id)({error}=await S.sb.from("links").update(row).eq("id",f.dataset.id));
      else ({error}=await S.sb.from("links").insert({...row,sort:(S.links||[]).length}));
      if(error)return setErr(errSel,errText(error));
      if(f.dataset.id)closeDialog();
      toast("Ссылка сохранена");viewLinks();
    }
  }catch(err){toast(errText(err),true);}
  finally{if(btn&&btn.isConnected)btn.disabled=false;}
});

boot().catch(err=>{toast(errText(err),true);});
</script>
